name: Intelligence CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  portable-and-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ordaxsystems/ordax-os
          ref: 45ab6648835744ad8ae85ee617a3b6e8418545e8
          path: _upstream/ordax-os
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run ci
      - run: npm run test:compat
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_inference_builder_isolation.py' -v
      - run: python -m unittest discover -s tests/upstream -p 'test_inference_builder.py' -v
      - run: npm run package
      - run: npm run package:verify
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-intelligence-source
          path: dist/
          if-no-files-found: error
